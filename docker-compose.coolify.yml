# Docker Compose otimizado para deploy no Coolify
# Repositório: https://github.com/Mahanaicoach/google-maps-scraper-kit
services:
  google-maps-scraper:
    image: gosom/google-maps-scraper:v1.15.0
    container_name: gmaps-scraper
    restart: unless-stopped
    command: ["-web", "-data-folder", "/gmapsdata"]
    ports:
      - "8080:8080"
    volumes:
      - gmaps_data:/gmapsdata
      - gmaps_cache:/opt

volumes:
  gmaps_data:
  gmaps_cache:
