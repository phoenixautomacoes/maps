# Stack com Proteção por Chave de API (X-API-Key) para o Coolify
# Repositório: https://github.com/Mahanaicoach/google-maps-scraper-kit

services:
  google-maps-scraper:
    image: gosom/google-maps-scraper:v1.15.0
    container_name: gmaps-scraper
    restart: unless-stopped
    command: ["-web", "-data-folder", "/gmapsdata"]
    expose:
      - "8080"
    volumes:
      - gmaps_data:/gmapsdata
      - gmaps_cache:/opt

  auth-proxy:
    image: caddy:alpine
    container_name: gmaps-auth-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - SCRAPER_API_KEY=${SCRAPER_API_KEY:-sua-chave-secreta-aqui}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - google-maps-scraper

volumes:
  gmaps_data:
  gmaps_cache:
